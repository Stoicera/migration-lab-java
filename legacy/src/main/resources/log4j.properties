# log4j 1.2 Konfiguration, uebernommen vom alten Tomcat-Server (2016)
log4j.rootLogger=INFO, stdout, datei

log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=%d{dd.MM.yyyy HH:mm:ss} %-5p [%t] %c{1} - %m%n

# rollt taeglich, aufraeumen tut das Logverzeichnis niemand
log4j.appender.datei=org.apache.log4j.DailyRollingFileAppender
log4j.appender.datei.File=werkstatt.log
log4j.appender.datei.DatePattern='.'yyyy-MM-dd
log4j.appender.datei.layout=org.apache.log4j.PatternLayout
log4j.appender.datei.layout.ConversionPattern=%d{dd.MM.yyyy HH:mm:ss} %-5p [%t] %c - %m%n

log4j.logger.at.werkstatt=DEBUG
log4j.logger.org.springframework=WARN
