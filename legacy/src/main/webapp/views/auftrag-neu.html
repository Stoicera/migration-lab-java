<h2>Neuer Auftrag</h2>

<div class="row">
	<div class="col-md-6">
		<div class="form-group">
			<label>Kunde *</label>
			<select class="form-control" id="feld-kunde"
				ng-model="gewaehlterKunde"
				ng-options="k.anzeigeName for k in kunden track by k.id"
				ng-change="kundeGewaehlt()">
				<option value="">-- bitte wählen --</option>
			</select>
		</div>
		<div class="form-group">
			<label>Fahrzeug *</label>
			<select class="form-control" id="feld-fahrzeug"
				ng-model="auftrag.fahrzeugId"
				ng-options="f.id as (f.kennzeichen + ' - ' + f.marke + ' ' + f.modell) for f in fahrzeuge"
				ng-disabled="!gewaehlterKunde">
				<option value="">-- zuerst Kunde wählen --</option>
			</select>
			<p class="help-block" ng-if="gewaehlterKunde && fahrzeuge.length == 0">
				Dieser Kunde hat noch kein Fahrzeug - bitte zuerst
				<a href="#!/kunden/{{gewaehlterKunde.id}}">beim Kunden</a> anlegen.
			</p>
		</div>
		<div class="form-group">
			<label>Was ist zu tun? *</label>
			<textarea class="form-control" rows="3" ng-model="auftrag.beschreibung"
				id="feld-beschreibung" placeholder="z.B. Jahresservice, Bremsen quietschen..."></textarea>
		</div>
		<div class="form-group">
			<label>km-Stand bei Annahme</label>
			<input type="number" class="form-control" ng-model="auftrag.kmStand" id="feld-km">
		</div>
		<button class="btn btn-primary" ng-click="anlegen()" id="btn-auftrag-anlegen">Auftrag anlegen</button>
		<a href="#!/auftraege" class="btn btn-default">Abbrechen</a>
	</div>
</div>
