<h2>Fahrzeuge</h2>

<div class="row" style="margin-bottom: 10px;">
	<div class="col-md-4">
		<input type="text" class="form-control" placeholder="Filter (Kennzeichen, Marke...)"
			ng-model="filter" id="fahrzeug-filter">
	</div>
</div>

<table class="table table-striped table-hover" id="fahrzeuge-tabelle">
	<tr>
		<th>Kennzeichen</th>
		<th>Marke</th>
		<th>Modell</th>
		<th>Baujahr</th>
		<th>km-Stand</th>
		<th>Pickerl bis</th>
		<th>Besitzer</th>
	</tr>
	<tr ng-repeat="f in fahrzeuge | filter:filter">
		<td>{{f.kennzeichen}}</td>
		<td>{{f.marke}}</td>
		<td>{{f.modell}}</td>
		<td>{{f.baujahr}}</td>
		<td>{{f.kmStand}}</td>
		<td>{{f.pickerlDatum | date:'dd.MM.yyyy'}}</td>
		<td><a ng-if="f.kundeId" href="#!/kunden/{{f.kundeId}}">{{f.kundeName}}</a></td>
	</tr>
</table>

<p class="text-muted">Fahrzeuge werden beim jeweiligen Kunden angelegt.</p>
