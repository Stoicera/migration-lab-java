# Legacy-Stand: WerkstattCRM (Java 8 / Spring Boot 1.5 / AngularJS 1.8) + PostgreSQL 9.6
# Start: docker compose -f legacy/docker-compose.yml up -d
# App: http://localhost:8080  ·  JSP-Admin: http://localhost:8080/admin
services:
  db:
    image: postgres:9.6
    environment:
      POSTGRES_DB: werkstatt
      POSTGRES_USER: werkstatt
      # lokale Dev-Zugangsdaten, kein Secret
      POSTGRES_PASSWORD: werkstatt
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - werkstatt-db:/var/lib/postgresql/data
    ports:
      # nur loopback - die Test-DB gehoert nicht ins Netz (Review-Fund 22)
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U werkstatt -d werkstatt"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/werkstatt
      SPRING_DATASOURCE_USERNAME: werkstatt
      SPRING_DATASOURCE_PASSWORD: werkstatt
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # TCP-Check reicht: Boot/Tomcat oeffnet 8080 erst nach fertigem Context.
      # bash statt curl/wget - mehr ist im Temurin-JRE-Image nicht drin.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s

volumes:
  werkstatt-db:
