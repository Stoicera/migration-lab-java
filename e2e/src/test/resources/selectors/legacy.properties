# Selector map: intent key -> CSS selector, LEGACY stand (AngularJS 1.8 UI).
# The stage-5 Angular UI gets its own modern.properties with the same keys —
# scenarios and page objects stay untouched.

# How Waits.idle() detects "no pending HTTP work" — a property of the UI under
# test, not of the scenario. Known: angularjs ($http.pendingRequests). Stage 5
# adds: angular (Angular testability API). Unknown values throw (fail-loud).
wait.strategy=angularjs

nav.kunden=a[href='#!/kunden']
nav.fahrzeuge=a[href='#!/fahrzeuge']
nav.auftraege=a[href='#!/auftraege']
nav.rechnungen=a[href='#!/rechnungen']
nav.bericht=a[href='#!/bericht']

# Dashboard tables have no ids in the 2016 markup — positional column-div
# selectors, guarded by heading assertions in the tests (DashboardPage doc).
dashboard.kpiOffeneAuftraege=#anzahl-offene-auftraege
dashboard.kpiFertigeAuftraege=#anzahl-fertige-auftraege
dashboard.kpiOffeneRechnungen=#anzahl-offene-rechnungen
dashboard.werkstattHeading=#inhalt .row + .row .col-md-6:nth-of-type(1) h4
dashboard.werkstattHeaderCells=#inhalt .row + .row .col-md-6:nth-of-type(1) table th
dashboard.werkstattRows=#inhalt .row + .row .col-md-6:nth-of-type(1) table tr[ng-repeat]
dashboard.abholbereitHeading=#inhalt .row + .row .col-md-6:nth-of-type(2) h4
dashboard.abholbereitHeaderCells=#inhalt .row + .row .col-md-6:nth-of-type(2) table th
dashboard.abholbereitRows=#inhalt .row + .row .col-md-6:nth-of-type(2) table tr[ng-repeat]
dashboard.rowCells=td

kunden.searchField=#suchfeld
kunden.searchButton=#btn-suchen
kunden.newButton=#btn-kunde-neu
kunden.rows=#kunden-tabelle tr[ng-repeat]
kunden.rowNameLink=td:nth-child(1) a
kunden.rowDeleteButton=td:nth-child(5) button

kundeDetail.heading=h2
kundeDetail.anrede=#feld-anrede
kundeDetail.vorname=#feld-vorname
kundeDetail.nachname=#feld-nachname
kundeDetail.telefon=#feld-telefon
kundeDetail.email=#feld-email
kundeDetail.strasse=#feld-strasse
kundeDetail.plz=#feld-plz
kundeDetail.ort=#feld-ort
kundeDetail.notiz=#feld-notiz
kundeDetail.saveButton=#btn-kunde-speichern
# vehicle section of the customer (id collides with the global list's table on
# purpose — 2016 markup reuses #fahrzeuge-tabelle; only ever one view in the DOM)
kundeDetail.fahrzeugHeaderCells=#fahrzeuge-tabelle th
kundeDetail.fahrzeugRows=#fahrzeuge-tabelle tr[ng-repeat]
kundeDetail.fahrzeugRowCells=td
kundeDetail.fahrzeugRowDeleteButton=td button
kundeDetail.fahrzeugFormToggle=#btn-fahrzeug-form
kundeDetail.fahrzeugKennzeichen=#feld-kennzeichen
kundeDetail.fahrzeugMarke=#feld-marke
kundeDetail.fahrzeugModell=#feld-modell
kundeDetail.fahrzeugBaujahr=#feld-baujahr
kundeDetail.fahrzeugKm=#feld-kmstand
kundeDetail.fahrzeugSaveButton=#btn-fahrzeug-speichern

fahrzeuge.filterField=#fahrzeug-filter
fahrzeuge.headerCells=#fahrzeuge-tabelle th
fahrzeuge.rows=#fahrzeuge-tabelle tr[ng-repeat]
fahrzeuge.rowCells=td

auftraege.newButton=#btn-auftrag-neu
auftraege.rows=#auftraege-tabelle tr[ng-repeat]
auftraege.rowNumberCell=td:nth-child(1)
auftraege.rowStatusLabel=td:nth-child(7) span

auftragNeu.kundeSelect=#feld-kunde
auftragNeu.fahrzeugSelect=#feld-fahrzeug
auftragNeu.beschreibung=#feld-beschreibung
auftragNeu.km=#feld-km
auftragNeu.submitButton=#btn-auftrag-anlegen

auftragDetail.heading=h2
auftragDetail.statusLabel=#auftrag-status
auftragDetail.inArbeitButton=#btn-in-arbeit
auftragDetail.fertigButton=#btn-fertig
auftragDetail.abgeholtButton=#btn-abgeholt
auftragDetail.wiederArbeitButton=#btn-wieder-arbeit
auftragDetail.stornoButton=#btn-storno
auftragDetail.rechnungButton=#btn-rechnung-erstellen
auftragDetail.posTyp=#feld-pos-typ
auftragDetail.posBezeichnung=#feld-pos-bezeichnung
auftragDetail.posMenge=#feld-pos-menge
auftragDetail.posPreis=#feld-pos-preis
auftragDetail.posSaveButton=#btn-pos-speichern
auftragDetail.posHeaderCells=#positionen-tabelle tr:first-of-type th
auftragDetail.posRows=#positionen-tabelle tr[ng-repeat]
# nth-child unavoidable (no cell classes in 2016 markup) — tests pin the header order
auftragDetail.posRowBezeichnungCell=td:nth-child(2)
auftragDetail.posRowDeleteButton=td button
auftragDetail.summeNetto=#summe-netto

rechnungen.rows=#rechnungen-tabelle tr[ng-repeat]
rechnungen.rowNumberLink=td:nth-child(1) a
rechnungen.rowStatusLabel=td:nth-child(7) span
rechnungen.rowPayButton=td:nth-child(8) button

rechnungDetail.nummer=#rechnung-nummer
rechnungDetail.netto=#rechnung-netto
rechnungDetail.ust=#rechnung-ust
rechnungDetail.brutto=#rechnung-brutto
# the position table is the only one carrying ng-if in the invoice sheet
rechnungDetail.posHeaderCells=#rechnung-blatt table[ng-if] th
rechnungDetail.posRows=#rechnung-blatt table[ng-if] tr[ng-repeat]
rechnungDetail.rowCells=td

bericht.yearSelect=#feld-jahr
bericht.monthRows=#bericht-tabelle tr[ng-repeat]
bericht.summeAuftraege=#summe-auftraege
bericht.topKundenRows=#topkunden-tabelle tr[ng-repeat]
bericht.rowCells=td
