# Selector map: intent key -> CSS selector, MODERN stand (Angular UI since
# stage 5). Same intent keys as legacy.properties (parity-guarded), values
# point at the Angular UI's stable data-testid hooks — decoupled from styling
# and structure. The route-by-route hybrid history lives in git (stage 5).

# How Waits.idle() detects "no pending HTTP work" — a property of the UI under
# test, not of the scenario. angular = the app's pending-request counter
# (offene-requests.interceptor.ts; the app is zoneless, Testability observes
# nothing). Unknown values throw.
wait.strategy=angular

nav.kunden=a[href='/kunden']
nav.fahrzeuge=a[href='/fahrzeuge']
nav.auftraege=a[href='/auftraege']
nav.rechnungen=a[href='/rechnungen']
nav.bericht=a[href='/bericht']

# Dashboard — ported (Angular). data-testid travels with the content, so the
# section-reorder guard of the legacy map (positional selectors + heading pins)
# is structural here.
