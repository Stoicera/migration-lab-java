# Selector map: intent key -> CSS selector, MODERN stand.
# Stages 2-4: the modern stand still serves the AngularJS UI, so this map is
# identical to legacy.properties. It diverges in stage 5 (Angular UI) —
# scenarios and page objects stay untouched either way.

nav.kunden=a[href='#!/kunden']
nav.auftraege=a[href='#!/auftraege']
nav.rechnungen=a[href='#!/rechnungen']
nav.bericht=a[href='#!/bericht']

kunden.searchField=#suchfeld
kunden.searchButton=#btn-suchen
kunden.newButton=#btn-kunde-neu
kunden.rows=#kunden-tabelle tr[ng-repeat]
kunden.rowNameLink=td:nth-child(1) a
kunden.rowDeleteButton=td:nth-child(5) button

kundeDetail.heading=h2
kundeDetail.anrede=#feld-anrede
kundeDetail.vorname=#feld-vorname
kundeDetail.nachname=#feld-nachname
kundeDetail.telefon=#feld-telefon
kundeDetail.ort=#feld-ort
kundeDetail.saveButton=#btn-kunde-speichern

auftraege.newButton=#btn-auftrag-neu
auftraege.rows=#auftraege-tabelle tr[ng-repeat]
auftraege.rowNumberCell=td:nth-child(1)
auftraege.rowStatusLabel=td:nth-child(7) span

auftragNeu.kundeSelect=#feld-kunde
auftragNeu.fahrzeugSelect=#feld-fahrzeug
auftragNeu.beschreibung=#feld-beschreibung
auftragNeu.km=#feld-km
auftragNeu.submitButton=#btn-auftrag-anlegen

auftragDetail.heading=h2
auftragDetail.statusLabel=#auftrag-status
auftragDetail.inArbeitButton=#btn-in-arbeit
auftragDetail.fertigButton=#btn-fertig
auftragDetail.abgeholtButton=#btn-abgeholt
auftragDetail.rechnungButton=#btn-rechnung-erstellen
auftragDetail.posTyp=#feld-pos-typ
auftragDetail.posBezeichnung=#feld-pos-bezeichnung
auftragDetail.posMenge=#feld-pos-menge
auftragDetail.posPreis=#feld-pos-preis
auftragDetail.posSaveButton=#btn-pos-speichern
auftragDetail.posRows=#positionen-tabelle tr[ng-repeat]
auftragDetail.summeNetto=#summe-netto

rechnungen.rows=#rechnungen-tabelle tr[ng-repeat]
rechnungen.rowNumberLink=td:nth-child(1) a
rechnungen.rowStatusLabel=td:nth-child(7) span
rechnungen.rowPayButton=td:nth-child(8) button

rechnungDetail.nummer=#rechnung-nummer
rechnungDetail.netto=#rechnung-netto
rechnungDetail.ust=#rechnung-ust
rechnungDetail.brutto=#rechnung-brutto

bericht.yearSelect=#feld-jahr
bericht.monthRows=#bericht-tabelle tr[ng-repeat]
bericht.topKundenRows=#topkunden-tabelle tr[ng-repeat]
