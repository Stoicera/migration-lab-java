# Selector map: intent key -> CSS selector, MODERN stand.
# Stage 5 (Strangler Fig): this map diverges from legacy.properties route by
# route as the Angular UI takes over — scenarios and page objects stay
# untouched. The Angular UI carries stable data-testid hooks (decoupled from
# styling/structure); not-yet-ported routes keep their AngularJS selectors.

# How Waits.idle() detects "no pending HTTP work" — a property of the UI under
# test, not of the scenario. hybrid = per-page dispatch between the Angular
# pending-request counter and AngularJS' $http.pendingRequests while both UIs
# coexist; becomes: angular at cutover. Unknown values throw.
wait.strategy=hybrid

# Hybrid nav: ported routes live at path URLs in the Angular shell, the rest
# full-page-loads into the AngularJS UI at /alt.html#!… — href values are
# byte-identical in BOTH shells, so these selectors hold wherever a flow is.
nav.kunden=a[href='/alt.html#!/kunden']
nav.fahrzeuge=a[href='/alt.html#!/fahrzeuge']
nav.auftraege=a[href='/alt.html#!/auftraege']
nav.rechnungen=a[href='/alt.html#!/rechnungen']
nav.bericht=a[href='/alt.html#!/bericht']

# Dashboard — ported (Angular). data-testid travels with the content, so the
# section-reorder guard of the legacy map (positional selectors + heading pins)
# is structural here.
dashboard.kpiOffeneAuftraege=[data-testid='kpi-offene-auftraege']
dashboard.kpiFertigeAuftraege=[data-testid='kpi-fertige-auftraege']
dashboard.kpiOffeneRechnungen=[data-testid='kpi-offene-rechnungen']
dashboard.werkstattHeading=[data-testid='werkstatt-heading']
dashboard.werkstattHeaderCells=[data-testid='werkstatt-tabelle'] th
dashboard.werkstattRows=tr[data-testid='werkstatt-zeile']
dashboard.abholbereitHeading=[data-testid='abholbereit-heading']
dashboard.abholbereitHeaderCells=[data-testid='abholbereit-tabelle'] th
dashboard.abholbereitRows=tr[data-testid='abholbereit-zeile']
dashboard.rowCells=td

