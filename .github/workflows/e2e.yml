# Selenium E2E safety net — same scenarios against both stands via selector maps.
# Matrix target: legacy | modern. The legacy leg is the sacred gate from
# stage-1-safety-net onward; the modern leg has been armed since stage 2 and
# drives the Angular 22 UI since stage 5 (selector map v2, angular wait strategy).
# All steps run UNCONDITIONALLY (ADR-0008): presence gates are retired.
name: e2e

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '0 2 * * *' # nightly, 02:00 UTC
  workflow_dispatch:

# Least privilege (CodeQL actions/missing-workflow-permissions, 2026-10-21): the jobs
# here only read the repository; artefact upload and the Actions cache use the
# runtime token, not GITHUB_TOKEN, so read access to the contents is all it needs.
permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [legacy, modern]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Start ${{ matrix.target }} stand
        run: docker compose -f ${{ matrix.target }}/docker-compose.yml up -d --wait

      - name: Run E2E suite against ${{ matrix.target }}
        run: ./mvnw -B verify -f e2e/pom.xml -Dtarget=${{ matrix.target }}

      # Äquivalenz-Nachweis: the surefire reports of the 34 equivalence scenarios, before the
      # page test below adds its own (separate reports directory, so it never enters the count).
      - name: Upload test reports (Nachweis)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nachweis-e2e-${{ matrix.target }}
          path: e2e/target/surefire-reports/TEST-*.xml
          if-no-files-found: warn

      # The /nachweis page exists on the modern stand only. Tagged "nachweis" and excluded from
      # the default run, so the equivalence count stays 34 per stand on both legs.
      - name: Nachweis page (modern stand only)
        if: matrix.target == 'modern'
        run: >
          ./mvnw -B verify -f e2e/pom.xml -Dtarget=modern
          -Dgroups=nachweis -De2e.excludedGroups=none
          -De2e.reportsDirectory=target/surefire-reports-nachweis

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-screenshots-${{ matrix.target }}
          path: e2e/target/screenshots/
          if-no-files-found: ignore

      - name: Stop ${{ matrix.target }} stand
        if: always()
        run: docker compose -f ${{ matrix.target }}/docker-compose.yml down -v
