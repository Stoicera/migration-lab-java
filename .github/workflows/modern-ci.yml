# Modern stand: build, then the EQUIVALENCE GATE — the same characterization
# suite that locks the legacy behaviour runs against the modern stand
# (module unit/integration tests exist since 2026-07-31: ArchUnit + Testcontainers).
# Functional equivalence is proven per commit, not claimed (ADR-0004).
# All steps run UNCONDITIONALLY (ADR-0008): presence gates are retired.
name: modern-ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Least privilege (CodeQL actions/missing-workflow-permissions, 2026-10-21): the jobs
# here only read the repository; artefact upload and the Actions cache use the
# runtime token, not GITHUB_TOKEN, so read access to the contents is all it needs.
permissions:
  contents: read

jobs:
  modern-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # the modern JDK rises stage by stage — single source of truth: the pom.
      # An empty extraction fails loudly here instead of downstream.
      - name: Read JDK version from pom
        id: jdk
        run: |
          v="$(grep -oPm1 '(?<=<java.version>)[^<]+' modern/pom.xml | sed 's/^1\.//')"
          test -n "$v"
          echo "jdk=$v" >> "$GITHUB_OUTPUT"

      - name: Set up JDK ${{ steps.jdk.outputs.jdk }} (Temurin)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ steps.jdk.outputs.jdk }}
          cache: maven

      - name: Build and verify modern module
        run: ./mvnw -B verify -f modern/pom.xml

      # ---- equivalence gate: characterization vs the MODERN stand ----
      - name: Set up JDK 25 (Temurin) for characterization
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Start modern stand
        run: docker compose -f modern/docker-compose.yml up -d --wait

      - name: Characterization vs modern stand (functional equivalence)
        run: >
          ./mvnw -B verify -f characterization/pom.xml
          -DbaseUrl=http://localhost:8090
          -DdbUrl=jdbc:postgresql://localhost:5434/werkstatt
          -Dstand=modern

      - name: Upload characterization report (Nachweis)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nachweis-characterization-modern
          path: characterization/target/nachweis/
          if-no-files-found: warn

      - name: Upload received captures on mismatch
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: characterization-received-modern
          path: characterization/target/characterization-received/
          if-no-files-found: ignore

      # ---- stage 6: the edge is an auth boundary, so it gets a test, not a claim ----
      # Deliberately a STEP of this job and not a job of its own: a new job means a new
      # required-check name, which means a manual branch-protection change
      # (docs/MANUAL_TASKS.md §E) and a window in which master is unmergeable.
      - name: Verify the reverse-proxy edge (auth, headers, rate limit)
        run: |
          export MODERN_ADMIN_AUTH="admin:$(openssl passwd -apr1 "$CI_EDGE_PASSWORD")"
          docker compose -f modern/docker-compose.yml -f modern/docker-compose.edge.yml up -d --wait
          EDGE_USER=admin EDGE_PASSWORD="$CI_EDGE_PASSWORD" modern/edge/verify-edge.sh
        env:
          # a throwaway credential for this run only — it guards nothing that outlives
          # the job, and the alternative (a repository secret) would make the check
          # unrunnable on forks
          CI_EDGE_PASSWORD: ci-only-${{ github.run_id }}

      - name: Stop modern stand
        if: always()
        env:
          # Compose interpolates the edge overlay's labels even for `down`, and the real
          # credential only existed inside the previous step's shell — which turned a
          # successful run into a red job on the first CI execution of this workflow.
          # Any value satisfies the interpolation; nothing authenticates during teardown.
          MODERN_ADMIN_AUTH: teardown-only-never-used
        run: docker compose -f modern/docker-compose.yml -f modern/docker-compose.edge.yml down -v

      # ---- stage 6: vulnerability scanning (DEVIATIONS "Security-Scan in CI") ----
      # Dependabot already watches the manifests; Trivy adds what it cannot see — the
      # RUNTIME IMAGE, i.e. the JRE base layer and its OS packages. A CVE in the base
      # image is invisible to every dependency scanner and ships to production anyway.
      - name: Build the modern image for scanning
        run: docker build -t migration-lab/modern:ci modern/

      - name: Scan the modern image (OS packages + Java dependencies)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: migration-lab/modern:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # Reporting, not blocking, and the reason is written down rather than implied:
          # a fresh CRITICAL in a base image arrives without any change of ours, and a
          # gate that turns master red overnight for something no commit caused is a
          # gate people learn to bypass. It is read at review time; DEVIATIONS.md
          # records this as reporting-only.
          exit-code: '0'

      # Same scan, machine-readable, for the count on /nachweis. The table above stays the
      # human-readable record; this one is only counted, never interpreted.
      - name: Scan the modern image (JSON for the Nachweis count)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: migration-lab/modern:ci
          format: json
          output: trivy.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload image-scan result (Nachweis)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nachweis-trivy
          path: trivy.json
          if-no-files-found: warn

  # ---- Äquivalenz-Nachweis (/nachweis) ----
  # Joins what the gates of THIS commit produced — characterization on both stands
  # (legacy-ci, modern-build), e2e on both stands (e2e.yml), the image scan — into one
  # nachweis.json artefact. It runs no test itself and is deliberately NOT a required
  # check: it reports, the gates decide. It waits for the two other workflows of the same
  # commit, so it finishes last. The deployed page shows the committed copy in
  # modern/frontend/public/nachweis.json; scripts/nachweis/refresh.sh updates it.
  nachweis:
    needs: modern-build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.HEAD_SHA }}

      - name: Collect the gate results of this commit
        run: |
          mkdir -p nachweis-in
          gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -p 'nachweis-*' -D nachweis-in/modern-ci \
            || echo "::warning::no Nachweis artefacts in this run"
          for wf in legacy-ci.yml e2e.yml; do
            id=""
            for i in $(seq 1 40); do
              id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow "$wf" --commit "$HEAD_SHA" \
                --event "${{ github.event_name }}" --json databaseId --jq '.[0].databaseId // empty')
              [ -n "$id" ] && break
              sleep 15
            done
            if [ -z "$id" ]; then echo "::warning::no $wf run for $HEAD_SHA"; continue; fi
            gh run watch "$id" -R "$GITHUB_REPOSITORY" --interval 30 > /dev/null || true
            gh run download "$id" -R "$GITHUB_REPOSITORY" -p 'nachweis-*' -D "nachweis-in/$wf" \
              || echo "::warning::no Nachweis artefacts in $wf run $id"
          done
          find nachweis-in -type f | sort

      - name: Build nachweis.json
        env:
          NACHWEIS_SHA: ${{ env.HEAD_SHA }}
          NACHWEIS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NACHWEIS_REPO: ${{ github.repository }}
        run: node scripts/nachweis/aggregate.mjs --in nachweis-in --out nachweis/nachweis.json

      - name: Upload nachweis.json
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nachweis
          path: nachweis/nachweis.json
          if-no-files-found: warn
