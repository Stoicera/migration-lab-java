# Legacy stand: build + characterization tests.
# HARD RULE: from tag stage-1-safety-net onward this workflow must stay green
# on every commit. Red = stop and fix, never "fix later".
# All steps run UNCONDITIONALLY (ADR-0008): the historical presence gates are
# retired — a missing module now fails loudly instead of skipping silently.
name: legacy-ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  legacy-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Guard against silent drift between the canonical seed/schema and the
      # modern stand's copies (e2e/characterization read the canonical files
      # directly — no copies there to guard).
      - name: Seed/schema drift guard
        run: |
          diff -q legacy/db/init/01-schema.sql modern/db/init/01-schema.sql
          diff -q legacy/db/init/02-daten.sql modern/db/init/02-daten.sql

      - name: Set up JDK 8 (Temurin)
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build and verify legacy module
        run: ./mvnw -B verify -f legacy/pom.xml

      # ---- characterization gate (armed since stage-1-safety-net) ----
      - name: Set up JDK 25 (Temurin) for characterization
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Start legacy stand
        run: docker compose -f legacy/docker-compose.yml up -d --wait

      - name: Run characterization tests (golden masters)
        run: ./mvnw -B verify -f characterization/pom.xml

      - name: Upload received captures on mismatch
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: characterization-received
          path: characterization/target/characterization-received/
          if-no-files-found: ignore

      - name: Stop legacy stand
        if: always()
        run: docker compose -f legacy/docker-compose.yml down -v
