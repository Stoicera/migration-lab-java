# Legacy stand: build + characterization tests.
# HARD RULE: from tag stage-1-safety-net onward this workflow must stay green
# on every commit. Red = stop and fix, never "fix later".
name: legacy-ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Skeleton gate (G0): the legacy module lands in G1 (stage-0-legacy).
      # Until legacy/pom.xml exists, this workflow passes as an empty scaffold.
      - name: Check module presence
        id: gate
        run: |
          if [ -f legacy/pom.xml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "legacy/ not yet present (starts in G1) — skeleton pass."
          fi

      - name: Set up JDK 8 (Temurin)
        if: steps.gate.outputs.present == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build and verify legacy module
        if: steps.gate.outputs.present == 'true'
        run: ./mvnw -B verify -f legacy/pom.xml

      # ---- characterization gate (armed since stage-1-safety-net) ----
      - name: Check characterization presence
        id: chargate
        run: |
          if [ -f characterization/pom.xml ] && [ -f legacy/docker-compose.yml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 25 (Temurin) for characterization
        if: steps.chargate.outputs.present == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Start legacy stand
        if: steps.chargate.outputs.present == 'true'
        run: docker compose -f legacy/docker-compose.yml up -d --wait

      - name: Run characterization tests (golden masters)
        if: steps.chargate.outputs.present == 'true'
        run: ./mvnw -B verify -f characterization/pom.xml

      - name: Upload received captures on mismatch
        if: failure() && steps.chargate.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: characterization-received
          path: characterization/target/characterization-received/
          if-no-files-found: ignore

      - name: Stop legacy stand
        if: always() && steps.chargate.outputs.present == 'true'
        run: docker compose -f legacy/docker-compose.yml down -v
