# =========================================================
# WerkstattCRM - Konfiguration (Entwicklung / Standard)
# ACHTUNG: Aenderungen bitte auch in application-prod.properties
# nachziehen, sonst stimmt am Server wieder nichts! (Hr. B.)
# =========================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/werkstatt
spring.datasource.username=werkstatt
spring.datasource.password=werkstatt
spring.datasource.driver-class-name=org.postgresql.Driver

# Firmendaten (werden auch am Rechnungs-Ausdruck angezeigt)
werkstatt.firma.name=KFZ-Werkstatt Moser GmbH
werkstatt.firma.strasse=Gewerbeparkstraße 12
werkstatt.firma.ort=4320 Perg
werkstatt.firma.telefon=+43 7262 12345
werkstatt.firma.uid=ATU12345678
werkstatt.ust.satz=20
werkstatt.version=1.4.2

# Datumsfelder als Timestamps, das Frontend (AngularJS date-Filter) rechnet damit
spring.jackson.datatype.datetime.write-dates-as-timestamps=true

# =========================================================
# Stage 6 (G7) — Betrieb. Alles darunter ist NEU und gehoert nicht zum
# 2016er-Bestand; siehe docs/adr/0012 … 0014 und playbook/07-betrieb-und-haertung.md.
# =========================================================

# --- Schema-Verwaltung: Flyway statt handgestarteter SQL-Dateien (Wart B18) ---
# db/migration = Schema (gilt ueberall), db/demo = Vorfuehrdaten.
# In Produktion faellt die zweite Location weg:
#   SPRING_FLYWAY_LOCATIONS=classpath:db/migration
spring.flyway.locations=classpath:db/migration,classpath:db/demo
# Bewusst KEIN baseline-on-migrate: auf einem bereits befuellten Volume wuerde
# Flyway V1 ueberspringen und die Seed-Migration ein zweites Mal einspielen.
# Ein Stand startet auf einem leeren Volume — docs/deployment.md §4.1.
spring.flyway.baseline-on-migrate=false

# --- Health: der Container fragt die App, nicht den Port ---
# probes.enabled ist in Boot 4 der Default; hier explizit, weil die
# Compose-Healthchecks genau /actuator/health/readiness abfragen.
management.endpoint.health.probes.enabled=true

# Readiness MUSS die Datenbank enthalten - der Default tut das NICHT.
# Gemessen am 2026-08-05: mit gestopptem db-Container liefert die
# Readiness-Group unveraendert {"status":"UP"}, weil sie ab Werk nur
# readinessState enthaelt. Eine Readiness-Probe, die "bereit" sagt waehrend
# die Anwendung keine einzige fachliche Anfrage beantworten kann, ist
# schlechter als gar keine: sie erzeugt Vertrauen statt Information.
management.endpoint.health.group.readiness.include=readinessState,db
# Liveness bleibt bewusst OHNE db. Sonst startet ein Datenbank-Ausfall die
# gesunde Anwendung im Sekundentakt neu und macht aus einer Stoerung einen
# Ausfall - der klassische Fehler beim Uebersetzen von Health nach Probe.
management.endpoint.health.group.liveness.include=livenessState
# Nur health und info nach aussen. Alles andere (env, beans, mappings,
# heapdump …) bleibt zu — ein offener /actuator ist ein Datenleck.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# --- Tracing: standardmaessig AUS ---
# Ohne konfigurierten Collector wuerde der OTLP-Exporter gegen localhost:4318
# laufen und im Sekundentakt Verbindungsfehler loggen. Das Observability-Profil
# (docker compose --profile observability) schaltet beides zusammen ein.
management.tracing.enabled=${WERKSTATT_TRACING_ENABLED:false}
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=${WERKSTATT_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
# Dienstname in Traces und in den strukturierten Logs
spring.application.name=werkstatt-crm-modern

# Micrometer legt die Korrelations-IDs als traceId/spanId ins MDC, und genau so
# landen sie im Log. Das ECS-Schema heisst aber trace.id / span.id — wer die Logs
# an einen ECS-Empfaenger schickt, findet sie sonst nicht. Wenn wir das Format
# "ECS" nennen, muss es ECS sein.
logging.structured.json.rename.traceId=trace.id
logging.structured.json.rename.spanId=span.id

# Wire-Kompatibilitaet Fehlerkontrakt (siehe JacksonWireCompatConfig):
# Boot 1.5 lieferte im Standard-Fehler-JSON immer "exception" und "message"
# mit - Boot 2+ blendet beide aus. Das Frontend zeigt e.message im Fehlerfall
# an; die Characterization-Suite pinnt die Body-Form (ErrorContract-Tests).
# (Boot 4: server.error.* wurde zu spring.web.error.*)
spring.web.error.include-message=always
spring.web.error.include-exception=true
