# Modern-Stand: grows stage by stage (see stages.md)
# Start: docker compose -f modern/docker-compose.yml up -d
# App: http://localhost:8090  ·  Admin (SPA-Route seit Stage 5): http://localhost:8090/admin
services:
  db:
    image: postgres:9.6
    environment:
      POSTGRES_DB: werkstatt
      POSTGRES_USER: werkstatt
      # lokale Dev-Zugangsdaten, kein Secret
      POSTGRES_PASSWORD: werkstatt
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - modern-werkstatt-db:/var/lib/postgresql/data
    ports:
      # loopback only - the test DB does not belong on the network (review finding 22)
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U werkstatt -d werkstatt"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build: .
    ports:
      - "8090:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/werkstatt
      SPRING_DATASOURCE_USERNAME: werkstatt
      SPRING_DATASOURCE_PASSWORD: werkstatt
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # TCP check suffices: Boot/Tomcat opens 8080 only after the context is up.
      # bash instead of curl/wget - the Temurin JRE image ships neither.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s

volumes:
  modern-werkstatt-db:
